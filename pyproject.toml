[build-system]
# >=77 for the SPDX `license`/`license-files` fields used below. The older
# `License :: OSI Approved ::` classifier is deprecated and PyPI now warns on
# it, so this is the form a fresh upload should use.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "molom"
version = "0.4.0"
description = "Molecule viewer, builder and crystal visualiser with Blender-style ergonomics: OpenGL ball-and-stick, CIF crystallography, coordination polyhedra, saved cameras and a Blender export"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Christian Nelle" },
]
keywords = [
    "chemistry", "crystallography", "molecule", "viewer", "editor", "3d",
    "opengl", "ball-and-stick", "cif", "space-group", "symmetry",
    "coordination-polyhedra", "xyz", "smiles", "avogadro", "vesta", "blender",
    "orca", "quantum-chemistry", "vibrational-modes", "mof",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Core runtime.
dependencies = [
    "numpy",
    "PySide6",
    "PyOpenGL",
    # Space-group symbol -> symmetry operations, for the CIFs that name their
    # group and leave the operator loop out. It degrades to a structure a
    # QUARTER of its true size, which is invisible, so it has never been
    # optional. Small wheel, and pymatgen depends on it anyway.
    "spglib",
    # rdkit and openbabel WERE optional (the `chem` extra), on ORCA
    # Workbench's graceful-tiering model. That was the wrong trade for a
    # desktop GUI, and the numbers are one-sided.
    #
    # What a base install lost, measured: **2 of the 13 formats the Open
    # dialog advertises**. Only xyz and cif/mmcif have native readers - pdb,
    # mol, mol2, sdf, cml, gro, hin, gzmat, pdbqt and mdl all failed outright,
    # while still being listed in the file filter, so the user picked "PDB"
    # and got an error. It also lost SMILES entirely (paste, Ctrl+N and
    # import-by-name), the whole Optimize panel (every force-field tier), and
    # it made `resolve.classify` fall back to "assume any single word is a
    # SMILES", so Ctrl+Shift+N on "ethanol" never reached OPSIN.
    #
    # What they cost: rdkit 26.7 MB + openbabel 16.8 MB = **43.5 MB**, against
    # the 665 MB of PySide6 that is already mandatory - about 6%. Wheel
    # coverage was the one real argument against and it does not hold either:
    # both publish for Linux x86_64/aarch64, Windows and macOS arm64 across
    # cp310-cp314 (openbabel also Intel macOS and cp38/cp39).
    "rdkit",
    "openbabel-wheel",
]

[project.optional-dependencies]
# Kept so `pip install molom[chem]` keeps working for anyone who has it in a
# script or a README; both are core dependencies now, so it installs nothing
# extra.
chem = ["rdkit", "openbabel-wheel"]
# VIDEO export only. `imageio-ffmpeg` ships a ~25 MB static ffmpeg binary, and
# making every install carry it to serve the minority who export MP4 or GIF is
# the wrong trade: a PNG image sequence is the primary animation format and
# needs no ffmpeg at all. A system ffmpeg on PATH is preferred over this wheel
# anyway (see `core.animation.ffmpeg_candidates`), so most people who want
# video already have what they need.
video = ["imageio-ffmpeg"]
# `all` is now just the video extra, kept for the same reason as `chem`.
all = ["rdkit", "openbabel-wheel", "imageio-ffmpeg"]

[project.urls]
Homepage = "https://github.com/ACH-Repo/ACH-MoloM"
Source = "https://github.com/ACH-Repo/ACH-MoloM"
Issues = "https://github.com/ACH-Repo/ACH-MoloM/issues"
Changelog = "https://github.com/ACH-Repo/ACH-MoloM/blob/main/CLAUDE.md"

[project.scripts]
molom = "molom.__main__:main"

[tool.setuptools]
# Hand-written, so a new subpackage is silently left out of the wheel —
# `molom.addons` was, and add-ons are imported BY NAME at run time, so the
# omission would have shipped as a broken feature rather than an ImportError.
# `tests/test_round59_release.py` compares this list against what is on disk.
packages = ["molom", "molom.core", "molom.ui", "molom.addons",
            "molom.resources"]

[tool.setuptools.package-data]
# The application icon. Without this the wheel carries the module and none of
# the images, and MoloM falls back to the generic Python logo on an installed
# copy while looking perfect in the source tree — the worst kind of packaging
# bug, because it cannot be reproduced where it is developed.
#
# `.ico` is here because round 63 added `molom.ico` (the Explorer file-type
# icon) and this glob still said svg+png only, so the one asset added AFTER the
# list was written was the one being dropped. That is round 59's hand-written-
# list bug in the data glob instead of the package list, so
# `tests/test_round59_release.py` now checks every file in the directory
# against these patterns rather than naming extensions.
"molom.resources" = ["*.svg", "*.png", "*.ico"]
